version: '3'
services:
  dxcache:
    build:
      dockerfile: ./Dockerfile
      context: ./
    container_name: bm_pirateban
    volumes:
      - ./config:/usr/src/app/config
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: 50m
        max-file: "3"
